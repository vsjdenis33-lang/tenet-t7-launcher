name: Unpack project
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать архив
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then
            echo "zip не найден — выходим"
            exit 0
          fi
          unzip -o "$ZIP" -d tmp_unzip
          SRC=$(find tmp_unzip -type f -name "settings.gradle*" -exec dirname {} \; | head -n1)
          if [ -z "$SRC" ]; then
            SRC=$(find tmp_unzip -type f -name "build.gradle*" -exec dirname {} \; | head -n1)
          fi
          echo "Папка проекта: $SRC"
          rm -rf "$SRC"/.github
          cp -r "$SRC"/. .
          rm -rf tmp_unzip "$ZIP"
      - name: Записать в репозиторий
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "v1.0 — Tenet T7 Launcher"
          git push
